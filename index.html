<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q&A Forum</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .container-boxed {
      max-width: 1200px;
      margin: auto;
      padding: 2rem;
      background-color: white;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }
    .question, .answer {
      margin-top: 1rem;
      padding: 1rem;
      border: 1px solid #dee2e6;
      border-radius: 0.5rem;
      background-color: #f1f3f5;
    }
  </style>
</head>
<body>
  <div class="container-boxed mt-5 rounded">
    <div class="row">
      <!-- Main Section -->
      <div class="col-md-8">
        <h2 class="mb-4">Ask a Question</h2>
        <div class="mb-3">
          <input type="text" id="questionInput" class="form-control" placeholder="Type your question here...">
        </div>
        <button onclick="postQuestion()" class="btn btn-primary mb-4">Post Question</button>

        <h3>All Questions</h3>
        <div id="questionsList"></div>
      </div>

      <!-- Sidebar Section -->
      <div class="col-md-4">
        <h4>Latest News</h4>
        <ul class="list-group mb-4">
          <li class="list-group-item">Q&A platform launched 🚀</li>
          <li class="list-group-item">Backend coming soon!</li>
          <li class="list-group-item">Admin-only answers enabled</li>
        </ul>

        <!-- Admin Login Box -->
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Admin Login</h5>
            <input type="password" id="adminCodeInput" class="form-control" placeholder="Enter admin code">
            <button class="btn btn-success mt-2" onclick="adminLogin()">Login</button>
            <div id="adminStatus" class="text-success mt-2" style="display: none;">Logged in as Admin ✅</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const questionsKey = 'questions';
    const adminCode = 'yourSecretCode'; // <<< change this to your private admin code
    let isAdmin = false;

    function getQuestions() {
      return JSON.parse(localStorage.getItem(questionsKey)) || [];
    }

    function saveQuestions(questions) {
      localStorage.setItem(questionsKey, JSON.stringify(questions));
    }

    function postQuestion() {
      const input = document.getElementById('questionInput');
      const text = input.value.trim();
      if (!text) return;

      const questions = getQuestions();
      questions.push({ text, answers: [] });
      saveQuestions(questions);
      input.value = '';
      renderQuestions();
    }

    function postAnswer(index, answerText) {
      const questions = getQuestions();
      questions[index].answers.push(answerText);
      saveQuestions(questions);
      renderQuestions();
    }

    function adminLogin() {
      const input = document.getElementById('adminCodeInput');
      if (input.value === adminCode) {
        isAdmin = true;
        document.getElementById('adminStatus').style.display = 'block';
        renderQuestions();
      } else {
        alert("Incorrect code. Access denied.");
      }
    }

    function renderQuestions() {
      const questions = getQuestions();
      const list = document.getElementById('questionsList');
      list.innerHTML = '';

      questions.forEach((q, index) => {
        const qDiv = document.createElement('div');
        qDiv.className = 'question';
        qDiv.innerHTML = `<strong>Q:</strong> ${q.text}`;

        const answersHtml = q.answers.map(a => `<div class="answer mt-2"><strong>A:</strong> ${a}</div>`).join('');
        qDiv.innerHTML += answersHtml;

        if (isAdmin) {
          const answerInput = document.createElement('textarea');
          answerInput.className = 'form-control mt-3';
          answerInput.placeholder = "Type your answer here...";

          const answerBtn = document.createElement('button');
          answerBtn.innerText = "Post Answer";
          answerBtn.className = "btn btn-success mt-2";
          answerBtn.onclick = () => {
            const answer = answerInput.value.trim();
            if (answer) {
              postAnswer(index, answer);
            }
          };

          qDiv.appendChild(answerInput);
          qDiv.appendChild(answerBtn);
        }

        list.appendChild(qDiv);
      });
    }

    renderQuestions();
  </script>
</body>
</html>
